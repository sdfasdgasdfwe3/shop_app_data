<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="НПК Инфинити — Мобильное приложение партнера">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Инфинити">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>НПК Инфинити</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Modern shadcn / Vercel / Emil Kowalski Loading Screen */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #09090b;
      margin: 0;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    #app-loader {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: radial-gradient(circle at center, #18181b 0%, #09090b 100%);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 999999;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), visibility 0.4s;
    }
    #app-loader.loaded {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .loader-logo {
      width: 68px;
      height: 68px;
      border-radius: 18px;
      background: linear-gradient(135deg, #fbbf24 0%, #d97706 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
      box-shadow: 0 10px 25px rgba(251, 191, 36, 0.28);
      margin-bottom: 22px;
      animation: logoFloat 2.4s ease-in-out infinite;
    }
    @keyframes logoFloat {
      0%, 100% { transform: translateY(0) scale(1); filter: drop-shadow(0 0 0 rgba(251, 191, 36, 0)); }
      50% { transform: translateY(-4px) scale(1.03); filter: drop-shadow(0 0 16px rgba(251, 191, 36, 0.45)); }
    }
    .loader-title {
      color: #fafafa;
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }
    .loader-subtitle {
      color: #71717a;
      font-size: 13px;
      font-weight: 500;
      margin-bottom: 24px;
    }
    .loader-bar-bg {
      width: 150px;
      height: 3px;
      background: #27272a;
      border-radius: 4px;
      overflow: hidden;
      position: relative;
    }
    .loader-bar-fill {
      position: absolute;
      top: 0; left: 0; bottom: 0;
      background: linear-gradient(90deg, #3b82f6, #10b981);
      border-radius: 4px;
      animation: barShimmer 1.6s cubic-bezier(0.16, 1, 0.3, 1) infinite;
    }
    @keyframes barShimmer {
      0% { left: -40%; width: 40%; }
      50% { left: 20%; width: 65%; }
      100% { left: 100%; width: 35%; }
    }
  </style>
</head>
<body>
  <!-- Ultra-smooth initial loader -->
  <div id="app-loader">
    <div class="loader-logo">♾️</div>
    <div class="loader-title">НПК Инфинити</div>
    <div class="loader-subtitle">Загрузка приложения...</div>
    <div class="loader-bar-bg">
      <div class="loader-bar-fill"></div>
    </div>
  </div>

  <script>
    // Очищаем устаревший Service Worker и кэш при обновлении версии
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
      if ('caches' in window) {
        caches.keys().then(function(names) {
          for (var name of names) caches.delete(name);
        });
      }
    }

    // Dismiss loader once Flutter views attach
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        var loader = document.getElementById('app-loader');
        if (loader) loader.classList.add('loaded');
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // Fallback: hide after 8s max
    setTimeout(function() {
      var loader = document.getElementById('app-loader');
      if (loader) loader.classList.add('loaded');
    }, 8000);
  </script>
  <script src="flutter_bootstrap.js?v=20260914_09" async></script>
</body>
</html>
